
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Music Player</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #09090f, #1e1040, #071b2e);
    font-family: Arial, sans-serif;
    color: white;
}

.player {
    width: 350px;
    max-width: 92vw;
    padding: 25px;
    background: #151525;
    border: 1px solid #343450;
    border-radius: 25px;
    box-shadow: 0 0 35px #8b5cf644;
    text-align: center;
}

h2 {
    color: #c4b5fd;
    margin: 0 0 20px;
}

.cover {
    width: 190px;
    height: 190px;
    margin: auto;
    border-radius: 50%;
    background: linear-gradient(135deg, #a855f7, #06b6d4, #ec4899);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 75px;
    box-shadow: 0 0 30px #a855f766;
}

.cover.playing {
    animation: rotate 8s linear infinite;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

h3 {
    margin: 24px 0 7px;
}

#artist {
    color: #a5a5c0;
    font-size: 14px;
}

#status {
    color: #c4b5fd;
    font-size: 12px;
    margin: 12px 0;
}

input[type="range"] {
    width: 100%;
    accent-color: #a855f7;
    cursor: pointer;
}

.time {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #aaaac0;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    margin: 22px 0;
}

button {
    border: none;
    cursor: pointer;
    color: white;
    background: transparent;
    font-size: 25px;
}

button:hover {
    color: #c4b5fd;
}

#play {
    background: #a855f7;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    color: white;
    font-size: 25px;
}

#play:hover {
    background: #9333ea;
}

.volume {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0;
}

.playlist {
    margin-top: 20px;
    text-align: left;
}

.playlist h4 {
    color: #c4b5fd;
}

.track {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #222238;
    margin-top: 8px;
    font-size: 14px;
    text-align: left;
}

.track.active {
    background: #51277a;
}

.track span {
    color: #c4b5fd;
}
</style>
</head>

<body>

<div class="player">
    <h2>🎧 NEON PLAYER</h2>

    <div class="cover" id="cover">♫</div>

    <h3 id="title">Dream Music</h3>
    <div id="artist">My Music Player</div>
    <div id="status">Choose a song to start</div>

    <audio id="audio"></audio>

    <input type="range" id="progress"
           min="0" max="100" value="0">

    <div class="time">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <div class="controls">
        <button id="prev" aria-label="Previous">⏮</button>
        <button id="play" aria-label="Play">▶</button>
        <button id="next" aria-label="Next">⏭</button>
    </div>

    <div class="volume">
        <span>🔊</span>
        <input type="range" id="volume"
               min="0" max="1" step="0.01" value="0.7">
    </div>

    <div class="playlist">
        <h4>My Playlist</h4>
        <div id="tracks"></div>
    </div>
</div>

<script>
const songs = [
    {
        title: "Dream Music",
        artist: "Sample Track 1",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
    },
    {
        title: "Night Vibes",
        artist: "Sample Track 2",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
    },
    {
        title: "Chill Beats",
        artist: "Sample Track 3",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
    }
];

const audio = document.getElementById("audio");
const playBtn = document.getElementById("play");
const cover = document.getElementById("cover");
const progress = document.getElementById("progress");
const tracks = document.getElementById("tracks");

let currentIndex = 0;

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return mins + ":" + String(secs).padStart(2, "0");
}

function loadSong(index, autoplay = false) {
    currentIndex = (index + songs.length) % songs.length;
    const song = songs[currentIndex];

    audio.src = song.src;
    document.getElementById("title").textContent = song.title;
    document.getElementById("artist").textContent = song.artist;
    document.getElementById("status").textContent = "Ready to play";

    renderPlaylist();

    if (autoplay) {
        playSong();
    } else {
        playBtn.textContent = "▶";
        cover.classList.remove("playing");
    }
}

async function playSong() {
    try {
        await audio.play();
    } catch (error) {
        document.getElementById("status").textContent =
            "Playback unavailable. Check your internet.";
    }
}

function pauseSong() {
    audio.pause();
}

playBtn.addEventListener("click", () => {
    if (audio.paused) {
        playSong();
    } else {
        pauseSong();
    }
});

document.getElementById("prev").addEventListener("click", () => {
    loadSong(currentIndex - 1, true);
});

document.getElementById("next").addEventListener("click", () => {
    loadSong(currentIndex + 1, true);
});

audio.addEventListener("play", () => {
    playBtn.textContent = "❚❚";
    cover.classList.add("playing");
    document.getElementById("status").textContent = "Now Playing ♪";
});

audio.addEventListener("pause", () => {
    playBtn.textContent = "▶";
    cover.classList.remove("playing");
});

audio.addEventListener("timeupdate", () => {
    if (audio.duration) {
        progress.value = audio.currentTime / audio.duration * 100;
        document.getElementById("current").textContent =
            formatTime(audio.currentTime);
    }
});

audio.addEventListener("loadedmetadata", () => {
    document.getElementById("duration").textContent =
        formatTime(audio.duration);
});

audio.addEventListener("ended", () => {
    loadSong(currentIndex + 1, true);
});

audio.addEventListener("error", () => {
    document.getElementById("status").textContent =
        "Song load nahi hua. Internet ya audio link check karo.";
});

progress.addEventListener("input", () => {
    if (audio.duration) {
        audio.currentTime = Number(progress.value) / 100 * audio.duration;
    }
});

document.getElementById("volume").addEventListener("input", event => {
    audio.volume = Number(event.target.value);
});

function renderPlaylist() {
    tracks.innerHTML = "";

    songs.forEach((song, index) => {
        const button = document.createElement("button");
        button.className = "track" +
            (index === currentIndex ? " active" : "");

        const icon = document.createElement("span");
        icon.textContent = index === currentIndex ? "♫" : "♪";

        const label = document.createElement("span");
        label.textContent = song.title;

        button.append(icon, label);
        button.addEventListener("click", () => loadSong(index, true));
        tracks.appendChild(button);
    });
}

audio.volume = 0.7;
loadSong(0);
</script>

</body>
</html>
